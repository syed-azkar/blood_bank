{% extends 'base.html' %}
{% block title %}Edit Donor{% endblock %}
{% block content %}
<div class="container"><h1 class="h4 mb-3">Edit Donor</h1>
<form method="post">
  <div class="mb-3"><label class="form-label">Name</label><input name="name" class="form-control" value="{{ donor.name }}" required></div>
  <div class="mb-3"><label class="form-label">Blood Group</label><input name="blood_group" class="form-control" value="{{ donor.blood_group }}"></div>
  <div class="mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ donor.phone }}"></div>
  <button class="btn btn-primary">Save</button>
</form></div>
{% endblock %}
